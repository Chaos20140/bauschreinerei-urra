name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 ist seit April 2026 End-of-Life — 22 ist das aktive LTS.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        # `npm run build` erzeugt zusätzlich pro Route eine echte index.html
        # (tools/prerender-routes.mjs), damit Deep-Links HTTP 200 liefern.
        run: npm run build

      - name: Copy 404 fallback into dist
        # Bleibt als Auffangnetz für URLs ohne vorgerenderte Route.
        run: cp public/404.html dist/404.html

      - name: Verify build output
        # Bricht ab, bevor ein kaputtes Artefakt live geht.
        run: |
          set -e
          for f in dist/index.html dist/kontakt/index.html dist/datenschutz/index.html \
                   dist/robots.txt dist/sitemap.xml dist/og-image.jpg \
                   dist/frames/frame-001.jpg dist/frames-mobile/frame-001.jpg; do
            test -s "$f" || { echo "FEHLT oder leer: $f"; exit 1; }
          done
          if grep -rq "fonts.googleapis.com\|fonts.gstatic.com" dist/*.html; then
            echo "Google-Fonts-Verweis im Build gefunden — DSGVO-Regression."
            exit 1
          fi
          for leak in CLAUDE.md .env.local .env.example; do
            test ! -e "dist/$leak" || { echo "Interne Datei im Artefakt: $leak"; exit 1; }
          done
          echo "Build-Artefakt geprüft."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
