    <!--
      Content-Security-Policy als Meta-Tag, weil GitHub Pages keine eigenen
      Response-Header erlaubt. Grenzen dieser Zustellform: `frame-ancestors`
      und HSTS wirken per Meta NICHT — für echten Clickjacking-Schutz wäre ein
      Hoster mit Header-Konfiguration nötig (z. B. Cloudflare Pages `_headers`).

      ACHTUNG: `script-src` enthält den sha256-Hash des Inline-Boot-Scripts
      weiter unten (markiert mit data-csp-hashed). Jede noch so kleine Änderung
      an diesem Script — auch Whitespace — macht den Hash ungültig und die
      Seite bootet nicht mehr. Neuen Hash erzeugen mit:
        npm run csp:hash
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-6x8VeMOJS/MF610GpXWEn4SxGlAOk2el6eFeyYgS1Wc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-src https://maps.google.com https://www.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

    <script data-csp-hashed>
      // SPA-Router restore for GitHub Pages — decodes the path that 404.html
      // stashed into the query string and replaces history before React boots.
      (function () {
        var l = window.location;
        if (l.search.indexOf('p=') !== -1) {
          var q = {};
          l.search
            .slice(1)
            .split('&')
            .forEach(function (kv) {
              var i = kv.indexOf('=');
              if (i > -1) q[kv.slice(0, i)] = kv.slice(i + 1).replace(/~and~/g, '&');
            });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              '',
              l.pathname.replace(/\/$/, '') +
                (q.p || '') +
                (q.q ? '?' + q.q : '') +
                l.hash
            );
          }
        }
      })();
    </script>
